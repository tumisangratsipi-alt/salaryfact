name: Data Freshness Check

# Reads data-sources.json and Slack-alerts when a real-world data source
# is due for a re-check, or was never independently audited in the first
# place. This is a reminder, not an auto-fetch - it never edits the real
# data files, it only tells a human when to look.
#
# This replaces the old update-data.yml/scripts/update-data.py, which
# targeted a BLS series ID (LEU0252881600Q) that does not exist and had
# been silently failing every single run since 2026-05-27 while still
# reporting a green checkmark. Even with a valid series ID, that script's
# design was wrong for this repo: it proportionally scaled every
# city/category median off one unrelated national CPS statistic, which
# would have drifted the real BLS OEWS data (fixed 2026-08-31) away from
# reality on every future run, not toward it. See data-sources.json for
# the full incident writeup. This job replaces it with the same
# check-only, Slack-alert-for-manual-review pattern already used by
# networthrank's SCF watcher, rather than another auto-fetch attempt.

on:
  schedule:
    # Monthly. The real BLS OEWS release lands once a year (spring,
    # for the prior May reference period) - monthly is a wide enough
    # margin that this will always catch the real window.
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run freshness check
        run: python scripts/check-data-freshness.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO_NAME: salaryfact

      - name: Check for state file changes
        id: diff
        run: |
          if git diff --quiet .data-freshness-state.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit alert state
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@salaryfact.com"
          git add .data-freshness-state.json
          git commit -m "chore: record data freshness alert state"
          git push
